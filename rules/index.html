
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSIRIS VANGUARD | AMBIENCE</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
    background:
        linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.8)),
        url("assets/background.jpg") center / cover no-repeat fixed;
    background-color: #080b0a;
}

.player {
    width: 340px;
    max-width: 90%;
    padding: 28px;
    background: rgba(10, 14, 12, .82);
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(14px);
    box-shadow: 0 15px 50px rgba(0,0,0,.5);
}

.header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
}

.header .symbol {
    font-size: 22px;
    color: #a8b4a6;
}

.header h1 {
    font-size: 13px;
    letter-spacing: 3px;
    font-weight: 700;
}

.cover {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    margin-bottom: 22px;
    border: 1px solid rgba(255,255,255,.08);
}

.track-info {
    margin-bottom: 22px;
}

.track-info h2 {
    font-size: 19px;
    letter-spacing: 1px;
    margin-bottom: 6px;
}

.track-info p {
    font-size: 12px;
    color: #a7aaa7;
    letter-spacing: 1px;
}

.progress-area {
    margin-bottom: 18px;
}

.progress {
    width: 100%;
    height: 4px;
    background: #353a36;
    appearance: none;
    cursor: pointer;
    accent-color: #a8b4a6;
}

.progress::-webkit-slider-thumb {
    appearance: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #c8d1c5;
}

.time {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 10px;
    color: #8c928d;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    margin: 20px 0;
}

.controls button {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    font-size: 20px;
}

.controls .play {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #c4cec1;
    color: #101410;
    font-size: 19px;
}

.volume-area {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
    color: #a7aaa7;
    font-size: 13px;
}

.volume {
    flex: 1;
    accent-color: #a8b4a6;
    cursor: pointer;
}

.footer {
    margin-top: 25px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,.08);
    text-align: center;
    font-size: 9px;
    letter-spacing: 2px;
    color: #737a74;
}

@media (max-width: 480px) {
    .player {
        padding: 22px;
    }
}
</style>
</head>

<body>

<div class="player">

    <div class="header">
        <span class="symbol">♫</span>
        <h1>OSIRIS AMBIENCE</h1>
    </div>

    <img
        class="cover"
        src="assets/ascend-cover.jpg"
        alt="Kevin Graham - Ascend cover"
    >

    <div class="track-info">
        <h2>ASCEND</h2>
        <p>KEVIN GRAHAM</p>
    </div>

    <audio id="audio" autoplay loop preload="auto">
        <source src="assets/bgm.mp3" type="audio/mpeg">
    </audio>

    <div class="progress-area">
        <input
            id="progress"
            class="progress"
            type="range"
            min="0"
            max="100"
            value="0"
        >

        <div class="time">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>
    </div>

    <div class="controls">
        <button id="restart" aria-label="Restart">↺</button>

        <button id="playButton" class="play" aria-label="Play">
            ▶
        </button>

        <button id="stopButton" aria-label="Stop">■</button>
    </div>

    <div class="volume-area">
        <span>♫</span>

        <input
            id="volume"
            class="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.07"
        >
    </div>

    <div class="footer">
        OSIRIS VANGUARD // AMBIENCE SYSTEM
    </div>

</div>

<script>
const audio = document.getElementById("audio");
const playButton = document.getElementById("playButton");
const stopButton = document.getElementById("stopButton");
const restartButton = document.getElementById("restart");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");

const currentTimeDisplay = document.getElementById("currentTime");
const durationDisplay = document.getElementById("duration");

audio.volume = 0.07;
audio.loop = true;

function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "0:00";

    const minutes = Math.floor(seconds / 60);
    const remainingSeconds = Math.floor(seconds % 60);

    return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
}

function updatePlayer() {
    if (!audio.duration) return;

    progress.value = (audio.currentTime / audio.duration) * 100;

    currentTimeDisplay.textContent = formatTime(audio.currentTime);
    durationDisplay.textContent = formatTime(audio.duration);
}

audio.addEventListener("timeupdate", updatePlayer);

audio.addEventListener("loadedmetadata", updatePlayer);

audio.addEventListener("play", () => {
    playButton.textContent = "Ⅱ";
});

audio.addEventListener("pause", () => {
    playButton.textContent = "▶";
});

playButton.addEventListener("click", () => {
    if (audio.paused) {
        audio.play();
    } else {
        audio.pause();
    }
});

stopButton.addEventListener("click", () => {
    audio.pause();
    audio.currentTime = 0;
});

restartButton.addEventListener("click", () => {
    audio.currentTime = 0;
    audio.play();
});

progress.addEventListener("input", () => {
    if (audio.duration) {
        audio.currentTime =
            (progress.value / 100) * audio.duration;
    }
});

volume.addEventListener("input", () => {
    audio.volume = Number(volume.value);
});

audio.addEventListener("ended", () => {
    audio.currentTime = 0;
    audio.play();
});

// Attempt automatic playback on page load.
window.addEventListener("load", () => {
    audio.play().catch((error) => {
        console.warn("Autoplay was blocked:", error);
    });
});
</script>

</body>
</html>
